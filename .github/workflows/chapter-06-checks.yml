name: Chapter 6 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapter-06:
    name: Chapter 6 on Java ${{ matrix.java }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    defaults:
      run:
        working-directory: chapters/chapter-06-ai-developer-tools
        shell: bash
    steps:
      - name: Check out the examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Run the core experiments
        run: sh run_all.sh
      - name: Resolve the optional JUnit dependencies
        run: mvn --batch-mode --no-transfer-progress -f testing/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath -Dmdep.outputFile=classpath.txt
      - name: Check the weak and strong JUnit tests
        run: JUNIT_CLASSPATH="$(cat testing/classpath.txt)" sh run_junit.sh
